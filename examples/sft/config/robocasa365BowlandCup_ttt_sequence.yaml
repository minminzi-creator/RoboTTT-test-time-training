# Standalone BowlAndCup Sequence32/H16 configuration. Set log_path explicitly.
# This run resumes 10K and compresses the original 50K LR schedule to 30K.
defaults:
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
  tracer:
    enable: false
  profiling:
    backend: nsight
    enabled: false
    worker_groups:
    - ActorGroup
    output_dir: null
    options:
      t: cuda,nvtx
      stats: false
      trace-fork-before-exec: true
      cuda-graph-trace: node
      force-overwrite: false
      capture-range: cudaProfilerApi
      capture-range-end: stop
      sample: none
      cpuctxsw: none
runner:
  task_type: sft
  logger:
    project_name: robottt
    experiment_name: robottt3
    log_path: null
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: -1
  resume_dir: /mnt/public/chenzm/robottt/workspace/results/robottt3.0/train_seq32_h16_20261105/robottt3/checkpoints/global_step_10000
  per_worker_log: false
  per_worker_log_path: null
  save_steps:
  - 15000
  - 20000
  - 25000
  - 30000
  resume_lr_migration: /mnt/public/chenzm/robottt/workspace/results/robottt3.0/train_seq32_h16_20261105/resume10k_30k_20261113.json
  resume_lr_schedule:
    mode: compress_remaining_cosine
    anchor_step: 10000
    original_total_steps: 50000
    total_steps: 30000
data:
  train_data_paths: /mnt/public/chenzm/robottt/h800_sft/assets/lerobot
  val_data_paths: null
  expected_episodes: 104
  num_workers: 2
  prefetch_factor: 1
  video_backend: torchcodec
  robottt:
    action_horizon: 16
    stride: 16
    max_anchors: 32
    terminal_window_probability: 0.0
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42
  cpu_threads: 4
  enable_offload: false
  model:
    model_type: gr00t_n1d7
    sequence_training: true
    precision: fp32
    load_to_device: false
    is_lora: false
    add_value_head: false
    model_path: /mnt/public/chenzm/robottt/h800_sft/assets/GR00T-N1.7-3B
    backbone_model_path: /mnt/public/chenzm/robottt/h800_sft/assets/Cosmos-Reason2-2B
    dependency_path: /mnt/public/chenzm/robottt/h800_sft/code/Isaac-GR00T
    dependency_commit: 23ace64f17aa5015259b8609d371eb61a357c776
    embodiment_tag: new_embodiment
    obs_converter_type: robocasa365
    action_dim: 12
    valid_action_dim: 12
    image_nums: 3
    num_action_chunks: 8
    denoising_steps: 4
    binary_action_threshold: 0.0
    tbptt_segment_length: 4
    gradient_checkpointing: true
    rl_head_config:
      use_ttt: true
      disable_dropout: true
      add_value_head: false
      ttt:
        num_register_tokens: 16
        hidden_size: 1536
        num_heads: 32
        mlp_ratio: 4
        tokens_per_anchor: 57
        base_lr: 0.1
        gate_init: 0.001
        o_proj_std: 0.02
        rope_theta: 10000.0
        position_mode: flattened
        compile_inner: true
    training_memory_source: supervised_noisy
    padding_aware_ttt: true
    memory_action_horizon: 16
    mask_padded_action_dims: true
  optim:
    lr: 2.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-05
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 200
    total_training_steps: 50000
    min_lr: 5.0e-06
    min_lr_rate: 0.25
    num_cycles: 0.5
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: true
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
      cast_forward_inputs: false
      cast_root_forward_inputs: false
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    save_full_model_weights: true
    wrappers:
      ttt_fast_weights:
        module_classes:
        - FastWeightTTT
        wrap_mode: subtree
    mixed_precision_policies:
      ttt_fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: false
        cast_root_forward_inputs: false
    mixed_precision_rules:
      ttt_fast_weights: ttt_fp32
  deterministic_training: true
  profiling:
    mode: 'off'
    start_step: 18
    end_step: 20
    ranks: null
    output_dir: null
    record_shapes: true
    with_stack: true
